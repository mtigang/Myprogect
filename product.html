<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصول | PCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        <span>PCraft</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">خانه</a>
        <a href="builder.html" class="nav-link">سیستم‌ساز</a>
        <a href="cart.html" class="nav-link">سبد خرید</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
            <path d="M6 6L5 3H2"/>
          </svg>
          <span class="badge cart-badge" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="product-page">
    <div class="product-detail">
      <div class="product-gallery">
        <img id="prod-img" src="" alt="">
      </div>
      <div class="product-info">
        <div class="brand" id="prod-brand"></div>
        <h1 id="prod-name"></h1>
        <div class="price-block">
          <span class="price" id="prod-price"></span>
        </div>
        <div class="stock">
          <span>●</span> موجود در انبار
        </div>
        <div class="flex gap-2">
          <button class="btn btn-primary" onclick="alert('به سبد خرید اضافه شد')">افزودن به سبد خرید</button>
          <a href="builder.html" class="btn btn-secondary">استفاده در سیستم‌ساز</a>
        </div>

        <h3 class="mt-4 mb-2">مشخصات فنی</h3>
        <table class="specs-table">
          <tbody id="prod-specs"></tbody>
        </table>
      </div>
    </div>

    <div id="compatible-products"></div>
  </div>

  <footer class="footer">
    <div class="footer-bottom" style="border:none; margin:0; padding:24px">
      © ۱۴۰۴ PCraft
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
