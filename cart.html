<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | PCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        <span>PCraft</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">خانه</a>
        <a href="builder.html" class="nav-link">سیستم‌ساز</a>
        <a href="cart.html" class="nav-link active">سبد خرید</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
            <path d="M6 6L5 3H2"/>
          </svg>
          <span class="badge cart-badge" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="cart-page">
    <h2 class="mb-3">سبد خرید</h2>

    <table class="cart-table">
      <thead>
        <tr>
          <th>محصول</th>
          <th>قیمت واحد</th>
          <th>تعداد</th>
          <th>جمع</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart-body">
        <!-- Filled by JS -->
      </tbody>
    </table>

    <div class="cart-summary" id="cart-summary" style="display:none">
      <div class="cart-summary-row">
        <span>جمع جزء</span>
        <span id="cart-subtotal">۰ تومان</span>
      </div>
      <div class="cart-summary-row">
        <span>هزینه ارسال</span>
        <span>رایگان</span>
      </div>
      <div class="cart-summary-row total">
        <span>مجموع</span>
        <span id="cart-total">۰ تومان</span>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:16px">ادامه فرآیند خرید</button>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom" style="border:none; margin:0; padding:24px">
      © ۱۴۰۴ PCraft
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
